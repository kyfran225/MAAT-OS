services:
  - type: web
    name: MAAT-STUDIO-IA-PREVIEW
    runtime: python
    repo: https://github.com/kyfran225/MAAT-STUDIO-IA
    branch: preview
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: preview
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
